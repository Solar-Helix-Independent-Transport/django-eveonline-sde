name: Tests

env:
  COVERAGE_DATABASE_VERSION: mariadb:10.11
  COVERAGE_PYTHON_VERSION: 3.12
  NODE_VERSION: 22 # [LTS] End of Life: 30 Apr 2027 (https://endoflife.date/nodejs)
  REDIS_VERSION: latest

on:
  push:
    branches:
      - '**'

    tags-ignore:
      - '**'

  pull_request:
    branches:
      - '**'

    tags-ignore:
      - '**'

jobs:
  # Run pre-commit Checks
  pre-commit:
    name: Pre Commit Checks
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v5

      # Set up Python
#      - name: Set up Python
#        uses: actions/setup-python@v5
#        with:
#          python-version-file: 'pyproject.toml' # Read the Python version from the pyproject.toml file

      # Set up Node.js
#      - name: Setup Node.js
#        uses: actions/setup-node@v4
#        with:
#          # https://endoflife.date/nodejs
#          node-version: ${{ env.NODE_VERSION }}
#          cache: 'npm'
#          cache-dependency-path: 'package-lock.json'
#      - run: npm install

      - name: Run Pre Commit Checks
        uses: pre-commit/action@v3.0.1

  # Run Test Coverage
  test-coverage:
    needs: [ pre-commit ]
    name: AA Latest (Python ${{ matrix.python-version }} with ${{ matrix.database.distribution }} ${{ matrix.database.version }})
    runs-on: ubuntu-latest

    strategy:
      # A failure on one database shouldn't cancel the others, which ones fail
      # is the useful part
      fail-fast: false
      matrix:
        # Set Python versions to test against
        python-version:
          # https://endoflife.date/python
          - '3.11'  # [EOL] End of Life: 31 Dec 2027
          - '3.12'  # [EOL] End of Life: 31 Dec 2028
          - '3.13'  # [EOL] End of Life: 31 Oct 2029
        # Set database versions to test against
        database:
          # https://endoflife.date/mysql
          - { distribution: mysql, version: '8.4' }     # [LTS] Maintained until: 30 Apr 2032
          # https://endoflife.date/mariadb and https://mariadb.com/kb/en/mariadb-server-release-dates/
          # - { distribution: mariadb, version: '10.11' } # [LTS] Maintained until: 16 Feb 2028
          - { distribution: mariadb, version: '11.4' }  # [LTS] Maintained until: 29 May 2029
          - { distribution: mariadb, version: '11.8' }  # [LTS] Maintained until: 04 Jun 2028

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v5

        # Install redis
      - name: Install redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: ${{ env.REDIS_VERSION }}

      # Verify that redis is up
      - name: Verify that redis is up
        run: redis-cli ping

      # Install and start the database. sqlite silently accepts oversized
      # ints/strings and defers constraint checks that a real database enforces.
      - name: Install ${{ matrix.database.distribution }} ${{ matrix.database.version }}
        uses: shogo82148/actions-setup-mysql@v1
        with:
          distribution: ${{ matrix.database.distribution }}
          mysql-version: ${{ matrix.database.version }}
          root-password: temp_password_aa_tox_tests

      # mysqlclient needs the MySQL client headers to build against - the same
      # package works against a MariaDB server.
      - name: Install MySQL client build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      # Set up Python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install Tox and any other packages
      - name: Install Tox and any other packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions

      # Run Tox with the specified environment
      - name: Run Tox
        env:
          USE_MYSQL: "True"
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: temp_password_aa_tox_tests
        run: tox -v

      # Upload coverage to Codecov
#      - name: Upload Coverage
#        if: ${{
#              (
#                github.event_name == 'pull_request'
#                || (
#                  github.event_name == 'push'
#                  && github.ref == 'refs/heads/master'
#                )
#              )
#              && (
#                matrix.python-version == env.COVERAGE_PYTHON_VERSION
#                && matrix.database == env.COVERAGE_DATABASE_VERSION
#              )
#            }}
#        uses: codecov/codecov-action@v5
#        with:
##          token: ${{ secrets.CODECOV_TOKEN }}
#          files: coverage.xml # optional
##          flags: unittests # optional
##          name: codecov-umbrella # optional
##          fail_ci_if_error: true # optional (default = false)
#          verbose: true # optional (default = false)
#        env:
#          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Run PyPi Build Test
  pypi-build-test:
    needs: [ test-coverage ]
    name: PyPi Build Test
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v5

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml' # Read the Python version from the pyproject.toml file

      # Install Tools
      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build
          python -m pip install --upgrade setuptools wheel

      # Build Package
      - name: Package Build
        env:
          STACKMANAGER_VERSION: 9999
        run: |
          python -m build

      # Upload Build Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event_name }}-${{ github.sha }}
          path: dist
          if-no-files-found: ignore

  # Note: the full SDE load test (a live download from CCP's servers) lives
  # in its own manually-triggered workflow - see sde-load-test.yml - rather
  # than running automatically on every push/PR.

