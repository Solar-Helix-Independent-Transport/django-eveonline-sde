name: SDE Load Test

# Downloads the real, current SDE from CCP's servers and does a full import -
# a live network integration smoke test, not a unit test. Deliberately
# manual-only (not run on push/PR): it depends on an external server, is
# slow, and its failure mode (CCP changed the data shape) isn't something a
# routine push/PR needs to catch on every run.

env:
  REDIS_VERSION: latest
  DB_DISTRIBUTION: mariadb
  DB_VERSION: '12.3'
  DB_ROOT_PASSWORD: temp_password_aa_tox_tests
  DB_NAME: tox_allianceauth

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to run the load test against'
        required: false
        default: '3.11'
        type: string

jobs:
  test-load:
    name: Test SDE Load (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v5

      # Install redis
      - name: Install redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: ${{ env.REDIS_VERSION }}

      # Verify that redis is up
      - name: Verify that redis is up
        run: redis-cli ping

      # Install and start MariaDB. A real database (rather than the sqlite
      # the rest of the suite runs against) is what actually enforces column
      # ranges/lengths - sqlite silently accepts oversized ints/strings that
      # MariaDB rejects, and that's exactly the class of bug (INT overflow,
      # VARCHAR truncation) this load test exists to catch against real SDE
      # data.
      - name: Install MariaDB
        uses: shogo82148/actions-setup-mysql@v1
        with:
          distribution: ${{ env.DB_DISTRIBUTION }}
          mysql-version: ${{ env.DB_VERSION }}
          root-password: ${{ env.DB_ROOT_PASSWORD }}

      # The action only creates the root account - Django needs the target
      # database to already exist.
      - name: Create database
        run: mysql -h 127.0.0.1 -u root -p"${{ env.DB_ROOT_PASSWORD }}" -e "CREATE DATABASE ${{ env.DB_NAME }} CHARACTER SET utf8mb4;"

      # mysqlclient (the Django MySQL backend used below) needs the MySQL
      # client headers to build against - the same package works against a
      # MariaDB server.
      - name: Install MySQL client build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      # Set up Python
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # Install Tox and any other packages
      - name: Install Tox and any other packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions

      # Run Tox with the specified environment, against the MariaDB instance
      # started above
      - name: Run Tox
        env:
          USE_MYSQL: "True"
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
          DB_NAME: ${{ env.DB_NAME }}
        run: tox -v -c tox_import.ini
