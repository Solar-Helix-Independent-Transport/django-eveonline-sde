[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "django-eveonline-sde"
description = "Eve Online SDE Export in Django Model form"
readme = "README.md"
keywords = [
    "allianceauth",
    "eve online",
]
license = { file = "LICENSE" }
authors = [
    { name = "Aaron Kable", email = "aaronkable@gmail.com" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "celery>=5,<6",
    "celery-once>=3,<4",
    "django-modeltranslation==0.19.17",
    "django-solo>=2,<3",
    "httpx>=0.28,<1",
]
urls."Issue / Bug Reports" = "https://github.com/Solar-Helix-Independent-Transport/django-eveonline-sde/issues"
urls.Changelog = "https://github.com/Solar-Helix-Independent-Transport/django-eveonline-sde/releases"

[tool.hatch]
version.path = "eve_sde/__init__.py"
build.include = [
    "eve_sde",
]
