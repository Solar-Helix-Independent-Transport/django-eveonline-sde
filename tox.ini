[tox]
requires =
    tox>=4.2
env_list =
    py3-django{61, 60, 52}

[testenv]
deps =
    coverage
    mysqlclient
    psycopg[binary]
    django52: django<6.0,>=5.2
    django60: django<6.1,>=6
    django61: django<6.2,>=6.1
pass_env =
    DB_HOST
    DB_NAME
    DB_PASSWORD
    DB_PORT
    DB_USER
    USE_MYSQL
    USE_POSTGRES
set_env =
    DJANGO_SETTINGS_MODULE = testauth.settings.local
commands =
    coverage run runtests.py eve_sde -v 2
    coverage report
    coverage xml
install_command = python -m pip install -U {opts} {packages}
