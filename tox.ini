[tox]
requires =
    tox>=4.2
env_list =
    py3

[testenv]
deps =
    allianceauth
    coverage
    django-webtest
    mysqlclient
    psycopg[binary]
pass_env =
    DB_HOST
    DB_NAME
    DB_PASSWORD
    DB_PORT
    DB_USER
    USE_MYSQL
    USE_POSTGRES
set_env =
    DJANGO_SETTINGS_MODULE = testauth.settings.local
commands =
    coverage run runtests.py eve_sde -v 2
    coverage report
    coverage xml
install_command = python -m pip install -U {opts} {packages}
