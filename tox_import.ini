[tox]
requires =
    tox>=4.2
env_list =
    py3

[testenv]
deps =
    allianceauth
    coverage
    django-webtest
    mysqlclient
set_env =
    DJANGO_SETTINGS_MODULE = testauth.settings.local
pass_env =
    USE_MYSQL
    DB_HOST
    DB_PORT
    DB_USER
    DB_PASSWORD
    DB_NAME
commands =
    python runtests.py -v 2 eve_sde.tests.load_test
install_command = python -m pip install -U {opts} {packages}
